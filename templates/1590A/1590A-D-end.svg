<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:serif="http://www.serif.com/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="30mm" height="25mm" viewBox="0 0 30 25">
  <title>1590A side D (30 x 25 mm)</title>
  <g id="Base-Artwork" serif:id="Base Artwork" inkscape:label="Base Artwork" inkscape:groupmode="layer">
    <rect id="Placeholder" serif:id="Placeholder (delete me)" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2" style="display:none"/>
  </g>
  <g id="Accent-Artwork" serif:id="Accent Artwork" inkscape:label="Accent Artwork" inkscape:groupmode="layer">
    <rect id="Placeholder" serif:id="Placeholder (delete me)" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2" style="display:none"/>
  </g>
  <g id="Logos" serif:id="Logos" inkscape:label="Logos" inkscape:groupmode="layer">
    <rect id="Placeholder" serif:id="Placeholder (delete me)" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2" style="display:none"/>
  </g>
  <g id="Labels" serif:id="Labels" inkscape:label="Labels" inkscape:groupmode="layer">
    <rect id="Placeholder" serif:id="Placeholder (delete me)" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2" style="display:none"/>
  </g>
  <g id="Holes" serif:id="Holes" inkscape:label="Holes" inkscape:groupmode="layer">
    <rect id="Placeholder" serif:id="Placeholder (delete me)" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2" style="display:none"/>
  </g>
  <g id="Knobs-and-Switches" serif:id="Knobs &amp; Switches" inkscape:label="Knobs &amp; Switches" inkscape:groupmode="layer">
    <rect id="Placeholder" serif:id="Placeholder (delete me)" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2" style="display:none"/>
  </g>
  <g id="Guides" serif:id="Guides" inkscape:label="Guides" inkscape:groupmode="layer" style="display:none">
    <rect id="Artboard-Edge" x="0" y="0" width="30" height="25" fill="none" stroke="#00B4FF" stroke-width="0.2"/>
    <rect id="Safe-Area" x="3" y="3" width="24" height="19" fill="none" stroke="#00B4FF" stroke-width="0.2" stroke-dasharray="1 1"/>
    <line id="Vertical-Center" x1="15" y1="0" x2="15" y2="25" fill="none" stroke="#00B4FF" stroke-width="0.2" stroke-dasharray="1 1"/>
    <line id="Horizontal-Center" x1="0" y1="12.5" x2="30" y2="12.5" fill="none" stroke="#00B4FF" stroke-width="0.2" stroke-dasharray="1 1"/>
    <g id="Center-Mark" serif:id="Center Mark">
      <line x1="12.5" y1="10" x2="17.5" y2="15" fill="none" stroke="#00B4FF" stroke-width="0.2"/>
      <line x1="12.5" y1="15" x2="17.5" y2="10" fill="none" stroke="#00B4FF" stroke-width="0.2"/>
    </g>
    <text id="Center-Label" serif:id="Center Label" x="15" y="17.3" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#00B4FF">(15, 12.5) mm</text>
